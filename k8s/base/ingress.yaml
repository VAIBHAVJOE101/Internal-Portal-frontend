# Single host, single route: everything goes to the frontend. Its nginx serves the SPA at "/" and proxies
# /devopsportal/ (API, OAuth, Swagger, actuator) to the backend Service, so cookies + CSRF work without CORS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-portal
  namespace: devops-portal
  labels:
    app.kubernetes.io/name: devops-portal-frontend
    app.kubernetes.io/part-of: devops-portal
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # keep the alert SSE stream (/devopsportal/api/alerts/stream) open and unbuffered
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts: [portal.example.com]
      secretName: devops-portal-tls
  rules:
    - host: portal.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: devops-portal-frontend, port: { number: 80 } } }
