apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-portal-frontend
spec:
  replicas: 2
  template:
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: ghcr.io/your-org/devops-portal-frontend:latest
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 128Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
