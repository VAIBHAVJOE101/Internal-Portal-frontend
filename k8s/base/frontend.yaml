# Frontend workload: Deployment + HorizontalPodAutoscaler + Service.
# nginx serves the SPA and proxies /devopsportal/ to the backend Service (devops-portal-backend:8080) inside the
# cluster, so the browser only ever talks to the frontend and the backend needs no ingress route of its own.
# Apply directly (kubectl apply -f frontend.yaml) or through kustomize (k8s/overlays/*).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-portal-frontend
  namespace: devops-portal
  labels:
    app.kubernetes.io/name: devops-portal-frontend
    app.kubernetes.io/part-of: devops-portal
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/name: devops-portal-frontend
      app.kubernetes.io/part-of: devops-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devops-portal-frontend
        app.kubernetes.io/part-of: devops-portal
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: ghcr.io/your-org/devops-portal-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # Backend Service name: both apps run in the same namespace of the same cluster
            - name: BACKEND_URL
              value: http://devops-portal-backend:8080
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 128Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devops-portal-frontend
  namespace: devops-portal
  labels:
    app.kubernetes.io/name: devops-portal-frontend
    app.kubernetes.io/part-of: devops-portal
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devops-portal-frontend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: v1
kind: Service
metadata:
  name: devops-portal-frontend
  namespace: devops-portal
  labels:
    app.kubernetes.io/name: devops-portal-frontend
    app.kubernetes.io/part-of: devops-portal
spec:
  selector:
    app.kubernetes.io/name: devops-portal-frontend
    app.kubernetes.io/part-of: devops-portal
  ports:
    - name: http
      port: 80
      targetPort: http
